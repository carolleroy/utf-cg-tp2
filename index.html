<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globo de neve</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://twgljs.org/dist/4.x/twgl-full.min.js" defer></script>
    <script src="src/camera.js" defer></script>
    <script src="src/renderer.js" defer></script>
    <script src="src/geometry.js" defer></script>
    <script src="src/model-loader.js" defer></script>
    <script src="src/obj-loader.js" defer></script>
    <script src="src/reindeer.js" defer></script>
    <script src="src/glb-loader.js" defer></script>
    <script src="src/christmas-tree.js" defer></script>
    <script src="src/festoon-lights.js" defer></script>
    <script src="src/gift-sleigh.js" defer></script>
    <script src="src/world.js" defer></script>
    <script src="src/glass-dome.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <!-- Menu de Controles no canto esquerdo -->
    <div id="controles-ui">
        <h2>Controles</h2>
        <ul>
            <li><kbd>L</kbd> <span>Ligar/Desligar luzes</span></li>
            <li><kbd>P</kbd> <span>Alternar posição da rena</span></li>
            <li><kbd>1</kbd> <span>Visão da câmera 1</span></li>
            <li><kbd>2</kbd> <span>Visão da câmera 2</span></li>
        </ul>
    </div>

    <canvas id="glCanvas" aria-label="Diorama de um globo de neve"></canvas>
    <p id="errorMessage" role="alert"></p>
</body>
</html>
